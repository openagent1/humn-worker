job_id: 2026-09-07-oasst2-full-extract-001
task: sample_extract
code_version: 0.2.0

data_source:
  type: huggingface_parquet
  repo: OpenAssistant/oasst2
  config: default
  split: train
  columns: [text, lang]
  revision: main

chunking:
  strategy: file_shard
  chunk_rows: 50000
  expected_chunks: 2

resources:
  cpu: 4
  ram_gb: 16
  gpu: none
  vram_gb: null
  estimated_runtime_min: 40
  estimated_storage_gb: 3
  estimated_network_gb: 2
  avg_tokens_per_doc: 250

worker:
  image: humn/worker-scan:0.2
  models: []

output:
  type: hf_dataset
  repo: humn-internal/social-register
  prefix: "2026-09-07-oasst2-full-extract-001"
  format: jsonl
  private: true

checkpoint:
  type: hf_dataset
  repo: humn-internal/social-register-ckpt
  manifest_path: manifest.json

credentials:
  hf_token_ro: env:HF_TOKEN_RO
  hf_token_rw: env:HF_TOKEN_RW

retry:
  max_attempts: 3
  backoff: exponential

validation:
  min_rows_per_chunk: 1
  schema_match: true
  checksum: sha256

metadata:
  objective_ref: configs/corpus-style.yaml
  created_by: data-hunter
  created_at: "2026-09-07"
