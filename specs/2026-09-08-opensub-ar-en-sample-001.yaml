code_version: 0.3.0
chunking:
  strategy: file_shard
  chunk_rows: 50000
  expected_chunks: 40
resources:
  cpu: 4
  ram_gb: 16
  gpu: none
  vram_gb: null
  avg_tokens_per_doc: 300
  estimated_runtime_min: 120
  estimated_storage_gb: 2
  estimated_network_gb: 3
worker:
  image: humn/worker-scan:0.3
  models: []
output:
  type: hf_dataset
  repo: humn-internal/social-register
  format: jsonl
  private: true
  prefix: 2026-09-08-opensub-ar-en-sample-001
checkpoint:
  type: hf_dataset
  repo: humn-internal/social-register-ckpt
  manifest_path: manifest.json
credentials:
