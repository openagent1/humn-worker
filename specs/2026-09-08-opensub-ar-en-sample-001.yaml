  hf_token_rw: env:HF_TOKEN_RW
retry:
  max_attempts: 3
  backoff: exponential
validation:
  min_rows_per_chunk: 1
  schema_match: true
  checksum: sha256
job_id: 2026-09-08-opensub-ar-en-sample-001
task: sample_extract
data_source:
  type: opus_zip
  repo: OPUS/OpenSubtitles-v2024
  url: https://object.pouta.csc.fi/OPUS-OpenSubtitles/v2024/moses/ar-en.txt.zip
  src_suffix: .ar
  tgt_suffix: .en
  sample_lines: 1000000
fallback_providers:
- github
- colab
metadata:
  objective_ref: configs/corpus-style.yaml
  created_by: data-hunter
  created_at: '2026-09-08'
