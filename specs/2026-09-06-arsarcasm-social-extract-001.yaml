job_id: 2026-09-06-arsarcasm-social-extract-001
task: sample_extract
code_version: 0.1.0

data_source:
  type: huggingface_parquet
  repo: iabufarha/ar_sarcasm
  config: default
  split: train
  columns: [tweet]
  revision: main

chunking:
  strategy: file_shard
  chunk_rows: 50000
  expected_chunks: 4

resources:
  cpu: 2
  ram_gb: 8
  gpu: none
  vram_gb: null
  estimated_runtime_min: 20
  estimated_storage_gb: 0.05
  estimated_network_gb: 0.01
  avg_tokens_per_doc: 200

worker:
  image: humn/worker-scan:0.1
  models: []

output:
  type: hf_dataset
  repo: humn-internal/social-register
  prefix: "2026-09-06-arsarcasm-social-extract-001"
  format: jsonl
  private: true

checkpoint:
  type: hf_dataset
  repo: humn-internal/social-register-ckpt
  manifest_path: manifest.json

credentials:
  hf_token_ro: env:HF_TOKEN_RO
  hf_token_rw: env:HF_TOKEN_RW

retry:
  max_attempts: 3
  backoff: exponential

validation:
  min_rows_per_chunk: 1
  schema_match: true
  checksum: sha256

metadata:
  objective_ref: configs/corpus-style.yaml#sft_mix
  created_by: data-hunter
  created_at: "2026-09-06"
