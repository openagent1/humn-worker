name: HUMN v0.2 Pipeline (ALL IN ONE)

# ONE click: runs every extraction job in parallel, then merges everything,
# builds pretrain + SFT-chat splits, publishes <you>/humn-social-register-v0.2.

on:
  workflow_dispatch:
    inputs:
      out_repo:
        description: 'Output repo ("auto" = <you>/humn-social-register-v0.2)'
        required: false
        default: 'auto'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - spec: specs/2026-09-07-wildchat-full-extract-001.yaml
            os: ubuntu-latest
            allow_failure: false
          - spec: specs/2026-09-07-oasst2-full-extract-001.yaml
            os: ubuntu-latest
            allow_failure: false
          - spec: specs/2026-09-07-reddit-jokes-extract-001.yaml
            os: ubuntu-latest
            allow_failure: false
          - spec: specs/2026-09-07-aya-dialect-extract-001.yaml
            os: ubuntu-latest
            allow_failure: false
          - spec: specs/2026-09-07-lmsys-ar-extract-001.yaml     # gated: needs agreement accepted
            os: ubuntu-latest
            allow_failure: true
          - spec: specs/2026-09-07-arz-glotlid-classify-001.yaml # fasttext builds on ubuntu-22.04
            os: ubuntu-22.04
            allow_failure: true
    continue-on-error: ${{ matrix.allow_failure }}
    env:
      WORKER_RUN: gh-${{ github.run_id }}-${{ strategy.job-index }}
      HF_TOKEN_RO: ${{ secrets.HF_TOKEN_RO }}
      HF_TOKEN_RW: ${{ secrets.HF_TOKEN_RW }}
      SOFT_DEADLINE_MIN: '150'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install worker deps
        run: pip install -r worker/requirements.txt

      - name: Install fasttext (classify jobs only)
        if: contains(matrix.spec, 'classify')
        run: pip install fasttext-wheel || pip install fasttext || echo "fasttext unavailable; job will fail (allowed)"

      - name: Run worker
        run: python worker/run_worker.py --spec "${{ matrix.spec }}" --workdir "$RUNNER_TEMP/humn-work"

      - name: Save manifest
        if: always()
        run: |
          mkdir -p out
          for f in "$RUNNER_TEMP/humn-work"/*/manifest.json; do
            [ -e "$f" ] || continue
            jobdir=$(dirname "$f")
            cp "$f" "out/$(basename "$jobdir")-manifest.json"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-${{ strategy.job-index }}-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: extract
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN_RW: ${{ secrets.HF_TOKEN_RW }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install deps
        run: pip install -r worker/requirements.txt

      - name: Merge + build pretrain/SFT splits + publish v0.2
        run: |
          python worker/merge_dataset.py \
            --jobs-dir specs \
            --workdir "$RUNNER_TEMP/humn-work" \
            --out-repo "${{ inputs.out_repo == 'auto' && 'auto' || inputs.out_repo }}" \
            --download \
            --upload \
            --token "$HF_TOKEN_RW"

      - name: Summary
        run: echo "v0.2 published. Check your Hugging Face profile > Datasets."
