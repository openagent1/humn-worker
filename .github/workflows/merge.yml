name: HUMN Dataset Merge & Publish

# One click: downloads all finished chunks from the checkpoint repo,
# merges them, dedups, writes the dataset card, publishes to Hugging Face.

on:
  workflow_dispatch:
    inputs:
      out_repo:
        description: 'Output dataset repo ("auto" = <your-username>/humn-social-register-<version>)'
        required: false
        default: 'auto'
      dataset_version:
        description: 'Dataset version for auto naming + card (e.g. v0.2)'
        required: false
        default: 'v0.3'

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN_RW: ${{ secrets.HF_TOKEN_RW }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install deps
        run: pip install -r worker/requirements.txt

      - name: Merge + dedup + publish
        run: |
          python worker/merge_dataset.py \
            --jobs-dir specs \
            --workdir "$RUNNER_TEMP/humn-work" \
            --out-repo "${{ inputs.out_repo }}" \
            --dataset-version "${{ inputs.dataset_version }}" \
            --download \
            --upload \
            --token "$HF_TOKEN_RW"

      - name: Summary
        run: echo "Dataset published. Check your Hugging Face profile > Datasets."
